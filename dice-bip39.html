<h1>Dice → BIP39</h1>
<p class="sub">d8 × 3 (9 bit) + d4 × 1 (2 bit) = 11 bit = 1 คำ · ทำงานออฟไลน์ ไม่บันทึกอะไร</p>

<div class="card">
  <div class="row"><div class="lab">d8 ลูกที่ 1</div><div class="btns d8" data-g="0" data-n="8"></div></div>
  <div class="row"><div class="lab">d8 ลูกที่ 2</div><div class="btns d8" data-g="1" data-n="8"></div></div>
  <div class="row"><div class="lab">d8 ลูกที่ 3</div><div class="btns d8" data-g="2" data-n="8"></div></div>
  <div class="row"><div class="lab">d4</div><div class="btns d4" data-g="3" data-n="4"></div></div>
  <div class="out"><span class="bits" id="bits">--- --- --- --</span><span class="word" id="word">—</span></div>
  <div class="meta" id="meta">เลือกหน้าลูกเต๋าให้ครบ 4 ลูก</div>
  <div class="act"><button id="clr">ล้าง</button><button id="add" class="primary" disabled>เพิ่มคำ</button></div>
</div>

<div class="card">
  <div class="lab">ความยาว seed</div>
  <div class="btns d4" style="grid-template-columns:1fr 1fr;margin-bottom:12px"><button id="m12">12 คำ</button><button id="m24" class="on">24 คำ</button></div>
  <div class="lab" id="cnt"></div>
  <ol id="list"></ol>
  <div class="act"><button id="undo">ลบคำล่าสุด</button><button id="wipe">ล้างทั้งหมด</button></div>
  <p class="note" id="hint"></p>
</div>

<p class="note" id="wl"></p>
<p class="warn">ใช้บนเครื่องที่ปิดเน็ต (โหมดเครื่องบิน) เท่านั้น อย่าแคปหน้าจอ จดเสร็จแล้วปิดแท็บ ข้อมูลจะหายทันที</p>
